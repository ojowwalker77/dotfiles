#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version = 2
final_space = true
console_title_template = '{{ .Shell }} in {{ .Folder }}'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'path'
    style = 'plain'
    foreground = '#ffffff'
    template = '{{ .Path }}'

    [blocks.segments.properties]
      style = 'short'

  [[blocks.segments]]
    type = 'git'
    style = 'plain'
    foreground = '#169976'
    template = ' {{ .HEAD }}{{ if .Staging.Changed }} <#1DCD9F>+{{ .Staging.Changed }}</>{{ end }}{{ if .Working.Changed }} <#ffc107>~{{ .Working.Changed }}</>{{ end }}{{ if .Working.Untracked }} <#ffc107>?{{ .Working.Untracked }}</>{{ end }}'

    [blocks.segments.properties]
      branch_icon = ''
      fetch_status = true
      fetch_upstream_icon = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
      '{{if gt .Code 0}}#ff6b6b{{end}}',
      '{{if eq .Code 0}}#1DCD9F{{end}}',
    ]
    template = '›'

[transient_prompt]
  foreground_templates = [
    '{{if gt .Code 0}}#ff6b6b{{end}}',
    '{{if eq .Code 0}}#1DCD9F{{end}}',
  ]
  template = '› '

[secondary_prompt]
  foreground = '#1DCD9F'
  template = '›› '
