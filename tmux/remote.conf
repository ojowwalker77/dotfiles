# =============================================================================
# REMOTE WINDOWS
# Windows of the tmux session "main" on each host in ~/.config/tmux/remote-hosts
# show up in this session's window list (tagged @remote_host/@remote_id, drawn
# in yellow by status-format). Switching windows stays local; pane keys inside
# a remote window drive that host's tmux.
# Scripts: ~/.config/tmux/remote.sh (here), mirror-host.sh (on each host).
# New box: run the line from `remote.sh bootstrap` there, then `remote.sh add user@host` here.
# =============================================================================

# Splits
bind -n C-M-S-'\' if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} split h' } { split-window -h -c "#{pane_current_path}" }
bind -n C-M-S-'-' if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} split v' } { split-window -v -c "#{pane_current_path}" }

# Navigation - vim keys
bind -n C-M-S-h if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane L' } { select-pane -L }
bind -n C-M-S-j if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane D' } { select-pane -D }
bind -n C-M-S-k if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane U' } { select-pane -U }
bind -n C-M-S-l if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane R' } { select-pane -R }

# Navigation - arrow keys
bind -n C-M-S-Left  if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane L' } { select-pane -L }
bind -n C-M-S-Down  if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane D' } { select-pane -D }
bind -n C-M-S-Up    if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane U' } { select-pane -U }
bind -n C-M-S-Right if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} pane R' } { select-pane -R }

# Resize panes
bind -n C-M-S-H if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} resize L' } { resize-pane -L 5 }
bind -n C-M-S-J if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} resize D' } { resize-pane -D 5 }
bind -n C-M-S-K if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} resize U' } { resize-pane -U 5 }
bind -n C-M-S-L if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} resize R' } { resize-pane -R 5 }

# New window: from a remote window it opens on that host
bind -n C-M-S-c if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh new #{@remote_host} #{@remote_id} #{session_name}' } { new-window -c "#{pane_current_path}" }

# Kill pane
bind -n C-M-S-x if -F '#{@remote_id}' { run -b '~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} kill' } { kill-pane }

# Rename window
bind -n C-M-S-',' if -F '#{@remote_id}' {
  command-prompt -I "#W" { run -b "~/.config/tmux/remote.sh rename #{@remote_host} #{@remote_id} #{window_id} '%%'" }
} {
  command-prompt -I "#W" { rename-window '%%' }
}

# Right-click window menu: Kill also kills the remote window, otherwise sync reopens its mirror
bind -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { if -F '#{@remote_id}' { run-shell "~/.config/tmux/remote.sh do #{@remote_host} #{@remote_id} killwin" } ; kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
