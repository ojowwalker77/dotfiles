# =============================================================================
# TMUX - Minimal Black
# =============================================================================

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Performance optimizations
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -s escape-time 0
set -g focus-events on
set -sg repeat-time 300
set -s set-clipboard on

# -----------------------------------------------------------------------------
# HYPER KEY BINDINGS (CapsLock = Ctrl+Option+Shift)
# No prefix needed - just Hyper + key
# -----------------------------------------------------------------------------

# Reload: Hyper + r
bind -n C-M-S-r source-file ~/.tmux.conf \; display-message "reloaded"

# Splits
bind -n C-M-S-'\' split-window -h -c "#{pane_current_path}"
bind -n C-M-S-'-' split-window -v -c "#{pane_current_path}"

# Navigation - vim keys
bind -n C-M-S-h select-pane -L
bind -n C-M-S-j select-pane -D
bind -n C-M-S-k select-pane -U
bind -n C-M-S-l select-pane -R

# Navigation - arrow keys
bind -n C-M-S-Left select-pane -L
bind -n C-M-S-Down select-pane -D
bind -n C-M-S-Up select-pane -U
bind -n C-M-S-Right select-pane -R

# Resize panes
bind -n C-M-S-H resize-pane -L 5
bind -n C-M-S-J resize-pane -D 5
bind -n C-M-S-K resize-pane -U 5
bind -n C-M-S-L resize-pane -R 5

# Windows
bind -n C-M-S-c new-window -c "#{pane_current_path}"
bind -n C-M-S-n next-window
# hyper-p reserved for aerospace carousel

# Switch windows by number
bind -n C-M-S-1 select-window -t 1
bind -n C-M-S-2 select-window -t 2
bind -n C-M-S-3 select-window -t 3
bind -n C-M-S-4 select-window -t 4
bind -n C-M-S-5 select-window -t 5
bind -n C-M-S-6 select-window -t 6
bind -n C-M-S-7 select-window -t 7
bind -n C-M-S-8 select-window -t 8
bind -n C-M-S-9 select-window -t 9

# Kill pane
bind -n C-M-S-x kill-pane

# Rename window
bind -n C-M-S-',' command-prompt -I "#W" "rename-window '%%'"

# Sessions
bind -n C-M-S-i choose-tree -s                                    # session picker
bind -n C-M-S-o command-prompt -I "#S" "rename-session '%%'"      # rename session
bind -n C-M-S-'[' new-session                                     # new session

# -----------------------------------------------------------------------------
# MINIMAL BLACK THEME
# -----------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#000000,fg=#666666"

# Three-section layout using status-format
set -g status-left ""
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""

# Remote windows (@remote_id, see remote.conf) are yellow; the #() keeps them in sync
set -g status-format[0] "#[align=left]#[fg=#666666][#S] #{W:#{?@remote_id,#[fg=#7d7743],#[fg=#444444]}#I:#W  ,#{?@remote_id,#[fg=#f1fa8c],#[fg=#bd93f9]}#I:#W  }#[align=right]#(~/.config/tmux/remote.sh sync '#{session_name}' >/dev/null 2>&1)#(~/.config/tmux/cpu-temp.sh) #[fg=#333333]│ #[fg=#666666]#(~/.config/tmux/stats.sh)"

set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#333333"

set -g message-style "bg=#000000,fg=#f1fa8c"
set -g message-command-style "bg=#000000,fg=#bd93f9"

setw -g mode-style "bg=#1a1a1a,fg=#ffffff"
setw -g clock-mode-colour "#bd93f9"

# Windows of the hosts in ~/.config/tmux/remote-hosts merged into the window list
source-file ~/.config/tmux/remote.conf
