# =============================================================================
# STARSHIP - Obsidian Theme
# =============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

# Clean single-line prompt
format = """$directory$git_branch$git_metrics$git_status$character"""

# No right prompt - keep it minimal
right_format = ""

add_newline = false

# -----------------------------------------------------------------------------
# CHARACTER
# -----------------------------------------------------------------------------
[character]
success_symbol = "[›](#1DCD9F)"
error_symbol = "[›](#555555)"
vimcmd_symbol = "[‹](#169976)"

# -----------------------------------------------------------------------------
# DIRECTORY
# -----------------------------------------------------------------------------
[directory]
style = "#ffffff"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "#555555"

# -----------------------------------------------------------------------------
# GIT BRANCH
# -----------------------------------------------------------------------------
[git_branch]
symbol = ""
style = "#169976"
format = "[$symbol$branch]($style) "

# -----------------------------------------------------------------------------
# GIT METRICS - Show +/- line changes
# -----------------------------------------------------------------------------
[git_metrics]
disabled = false
added_style = "#1DCD9F"
deleted_style = "#555555"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

# -----------------------------------------------------------------------------
# GIT STATUS - Only show when something needs attention
# -----------------------------------------------------------------------------
[git_status]
style = "#169976"
format = '[$all_status$ahead_behind]($style)'
conflicted = "[!](#ffffff)"
ahead = "[↑](#1DCD9F)"
behind = "[↓](#555555)"
diverged = "[↕](#ffffff)"
untracked = "[?](#169976)"
stashed = "[*](#169976)"
modified = "[~](#169976)"
staged = "[+](#1DCD9F)"
renamed = "[→](#1DCD9F)"
deleted = "[-](#555555)"

# -----------------------------------------------------------------------------
# DISABLED - Keep it minimal
# -----------------------------------------------------------------------------
[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[java]
disabled = true

[docker_context]
disabled = true

[aws]
disabled = true

[kubernetes]
disabled = true

[battery]
disabled = true

[cmd_duration]
disabled = true

[package]
disabled = true

[time]
disabled = true
