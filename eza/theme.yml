colourful: true

filekinds:
  normal: {foreground: "#ffffff"}
  directory: {foreground: "#1DCD9F", is_bold: true}
  symlink: {foreground: "#4de8be", is_italic: true}
  pipe: {foreground: "#555555"}
  block_device: {foreground: "#ffc107"}
  char_device: {foreground: "#ffc107"}
  socket: {foreground: "#169976"}
  special: {foreground: "#169976"}
  executable: {foreground: "#169976", is_bold: true}
  mount_point: {foreground: "#1DCD9F", is_bold: true}

perms:
  user_read: {foreground: "#ffffff"}
  user_write: {foreground: "#1DCD9F"}
  user_execute_file: {foreground: "#4de8be"}
  user_execute_other: {foreground: "#4de8be"}
  group_read: {foreground: "#888888"}
  group_write: {foreground: "#169976"}
  group_execute: {foreground: "#169976"}
  other_read: {foreground: "#555555"}
  other_write: {foreground: "#ffc107"}
  other_execute: {foreground: "#555555"}
  special_user_file: {foreground: "#ff6b6b"}
  special_other: {foreground: "#ff6b6b"}
  attribute: {foreground: "#555555"}

size:
  number_byte: {foreground: "#555555"}
  number_kilo: {foreground: "#ffffff"}
  number_mega: {foreground: "#1DCD9F"}
  number_giga: {foreground: "#ffc107"}
  number_huge: {foreground: "#ff6b6b"}
  unit_byte: {foreground: "#555555"}
  unit_kilo: {foreground: "#169976"}
  unit_mega: {foreground: "#169976"}
  unit_giga: {foreground: "#169976"}
  unit_huge: {foreground: "#169976"}
  major: {foreground: "#1DCD9F"}
  minor: {foreground: "#169976"}

users:
  user_you: {foreground: "#1DCD9F"}
  user_root: {foreground: "#ff6b6b"}
  user_other: {foreground: "#888888"}
  group_yours: {foreground: "#169976"}
  group_root: {foreground: "#ff6b6b"}
  group_other: {foreground: "#555555"}

links:
  normal: {foreground: "#555555"}
  multi_link_file: {foreground: "#ffc107"}

git:
  new: {foreground: "#1DCD9F"}
  modified: {foreground: "#ffc107"}
  deleted: {foreground: "#ff6b6b"}
  renamed: {foreground: "#4de8be"}
  ignored: {foreground: "#333333"}
  conflicted: {foreground: "#ff6b6b", is_bold: true}

git_repo:
  branch_main: {foreground: "#1DCD9F"}
  branch_other: {foreground: "#169976"}
  git_clean: {foreground: "#1DCD9F"}
  git_dirty: {foreground: "#ffc107"}

punctuation: {foreground: "#555555"}
date: {foreground: "#555555"}
inode: {foreground: "#444444"}
blocks: {foreground: "#444444"}
header: {foreground: "#1DCD9F", is_bold: true}
octal: {foreground: "#169976"}
flags: {foreground: "#555555"}

symlink_path: {foreground: "#169976"}
control_char: {foreground: "#ff6b6b"}
broken_symlink: {foreground: "#ff6b6b"}
broken_path_overlay: {foreground: "#ff6b6b"}

file_type:
  image: {foreground: "#169976"}
  video: {foreground: "#169976"}
  music: {foreground: "#169976"}
  crypto: {foreground: "#ffc107"}
  document: {foreground: "#ffffff"}
  compressed: {foreground: "#ffc107"}
  temp: {foreground: "#444444"}
  compiled: {foreground: "#555555"}
  build: {foreground: "#169976"}
  source: {foreground: "#ffffff"}

security_context:
  user: {foreground: "#1DCD9F"}
  role: {foreground: "#169976"}
  typ: {foreground: "#4de8be"}
  range: {foreground: "#555555"}
