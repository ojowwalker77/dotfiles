# Lazygit - Minimal Black
gui:
  theme:
    activeBorderColor:
      - '#1DCD9F'
      - bold
    inactiveBorderColor:
      - '#333333'
    optionsTextColor:
      - '#1DCD9F'
    selectedLineBgColor:
      - '#111111'
    cherryPickedCommitBgColor:
      - '#111111'
    cherryPickedCommitFgColor:
      - '#1DCD9F'
    unstagedChangesColor:
      - '#ff6b6b'
    defaultFgColor:
      - '#ffffff'
    searchingActiveBorderColor:
      - '#ffc107'
  showIcons: true
  showRandomTip: false
  showCommandLog: false
  nerdFontsVersion: "3"
  border: single
  animateExplosion: false
  screenMode: normal
os:
  editPreset: 'nvim'
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never
  commit:
    signOff: false
  autoFetch: true
  autoRefresh: true
confirmOnQuit: false
quitOnTopLevelReturn: true
